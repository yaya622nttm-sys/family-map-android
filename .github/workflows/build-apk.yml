name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK ライセンス承認 ──
      - name: Setup Android SDK
        run: |
          SDKMANAGER=""
          for p in "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; do
            [ -f "$p" ] && SDKMANAGER="$p" && break
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            echo "✅ Android SDK ready"
          fi

      # ── Gradle wrapper を生成 ──
      - name: Install Gradle and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x ./gradlew
          echo "✅ Gradle wrapper generated"

      # ── google-services.json を生成 ──
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "✅ google-services.json created"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON not set, using dummy"
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {"project_id":"dummy-proj","firebase_url":"https://dummy-proj-default-rtdb.firebaseio.com","storage_bucket":"dummy-proj.appspot.com","project_number":"123456789000"},
            "client":[{"client_info":{"mobilesdk_app_id":"1:123456789000:android:abcdef1234567890","android_client_info":{"package_name":"com.family.map"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
            "configuration_version":"1"
          }
          EOF
          fi

      # ── local.properties を生成 ──
      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          else
            echo "MAPS_API_KEY=PLACEHOLDER_KEY" >> local.properties
          fi

      # ── Debug APK をビルド ──
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── APK をアップロード ──
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMap-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── ビルド情報を表示 ──
      - name: Show APK info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APKビルド成功！ファイルサイズ: $SIZE"
            echo "📥 ActionsタブのArtifactsからダウンロードできます"
          fi
