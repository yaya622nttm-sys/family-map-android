name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK ライセンス承認 + 必要コンポーネント確認 ──
      - name: Setup Android SDK components
        run: |
          echo "=== Android SDK Info ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT/platforms/" 2>/dev/null || echo "No platforms dir"
          ls "$ANDROID_SDK_ROOT/build-tools/" 2>/dev/null || echo "No build-tools dir"
          # sdkmanager でライセンス承認 + android-34 確保
          SDKMANAGER=""
          for p in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; do
            [ -f "$p" ] && SDKMANAGER="$p" && break
          done
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || true
            echo "✅ SDK components installed"
          else
            echo "⚠️ sdkmanager not found"
          fi

      # ── Gradle wrapper を生成 ──
      - name: Install Gradle 8.6 and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x ./gradlew
          echo "✅ Gradle wrapper generated"
          cat gradle/wrapper/gradle-wrapper.properties

      # ── google-services.json を生成 ──
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "✅ google-services.json created ($(wc -c < app/google-services.json) bytes)"
            # JSON の妥当性チェック
            python3 -c "import json,sys; json.load(open('app/google-services.json')); print('✅ Valid JSON')" || echo "⚠️ Invalid JSON!"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON not set"
            # ダミーファイルを作成（ビルドを通すため）
            cat > app/google-services.json << 'DUMMY'
          {
            "project_info": { "project_id": "dummy", "firebase_url": "https://dummy.firebaseio.com", "storage_bucket": "dummy.appspot.com", "project_number": "000000000000" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.family.map" } }, "oauth_client": [], "api_key": [{ "current_key": "" }], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } }],
            "configuration_version": "1"
          }
          DUMMY
            echo "⚠️ Dummy google-services.json created"
          fi

      # ── local.properties を生成 ──
      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "✅ MAPS_API_KEY set"
          else
            echo "MAPS_API_KEY=PLACEHOLDER_KEY" >> local.properties
            echo "⚠️ Using placeholder MAPS_API_KEY"
          fi
          echo "--- local.properties ---"
          cat local.properties

      # ── Gradle の設定確認 ──
      - name: Verify Gradle setup
        run: |
          ./gradlew --version
          echo "✅ Gradle OK"

      # ── Debug APK をビルド（ログをファイルに保存） ──
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log

      # ── ビルド失敗時にログの末尾を表示 ──
      - name: Show build error log
        if: failure()
        run: |
          echo "=== LAST 150 LINES OF BUILD LOG ==="
          tail -150 /tmp/build.log || true

      # ── ビルドログをアーティファクトとして保存 ──
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build.log
          retention-days: 7

      # ── APK をアップロード ──
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMap-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── ビルド情報を表示 ──
      - name: Show APK info
        if: success()
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APKビルド成功！"
            echo "📦 ファイルサイズ: $SIZE"
          fi
