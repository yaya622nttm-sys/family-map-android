name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK ライセンス承認 + 必要コンポーネント確認 ──
      - name: Setup Android SDK components
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          # sdkmanager のパスを探す
          SDKMANAGER=""
          for path in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -f "$path" ]; then
              SDKMANAGER="$path"
              break
            fi
          done
          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager found: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
            echo "✅ Android SDK components installed"
          else
            echo "⚠️ sdkmanager not found, using pre-installed SDK"
            ls "$ANDROID_SDK_ROOT/platforms/" || true
          fi

      # ── Gradle wrapper を生成 ──
      - name: Install Gradle 8.6 and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x ./gradlew
          echo "✅ Gradle wrapper generated"

      # ── google-services.json を生成 ──
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "✅ google-services.json を Secrets から生成しました"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON が設定されていません"
          fi

      # ── local.properties を生成 ──
      - name: Create local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
            echo "✅ MAPS_API_KEY を設定しました"
          else
            echo "MAPS_API_KEY=PLACEHOLDER_KEY" >> local.properties
            echo "⚠️ MAPS_API_KEY が未設定です（地図は表示されません）"
          fi
          cat local.properties

      # ── Debug APK をビルド ──
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ── APK をアップロード ──
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyMap-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── ビルド情報を表示 ──
      - name: Show APK info
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APKビルド成功！"
            echo "📦 ファイルサイズ: $SIZE"
            echo "📥 ActionsタブのArtifactsからダウンロードできます"
          fi
